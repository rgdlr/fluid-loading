name: 🐛 Bug Report
description: Create a report to help us reproduce and fix an issue
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us resolve it quickly.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest version of `@fluid-loading/*`.
          required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      multiple: true
      options:
        - '@fluid-loading/core'
        - '@fluid-loading/react'
        - 'landing / documentation'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Please provide a minimal reproduction repository, StackBlitz link, or code snippet.
      placeholder: 'https://stackblitz.com/edit/...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: React version, Node version, browser, OS, bundler (Vite, Next.js, Webpack, etc.)
      placeholder: 'React 19, Vite 6, Chrome 130, macOS'
    validations:
      required: true
